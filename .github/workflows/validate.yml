name: Repository validation

on:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - "data/**"
      - "docs/**"
      - ".github/workflows/validate.yml"
      - "README.md"
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Full local validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install media test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg espeak-ng libcairo2
          python -m pip install --disable-pip-version-check -r requirements-media.txt
      - name: Run repository validation suite
        run: bash scripts/validate.sh
      - name: Upload cinematic preview for human visual review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cinematic-map-review-preview
          path: ci-artifacts/
          if-no-files-found: ignore
          retention-days: 3
