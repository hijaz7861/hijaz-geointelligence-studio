version: '3.8'

services:
  agent-army:
    build: .
    container_name: hijaz-agent-army
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
    ports:
      - "8080:8080"
    command: python3 cli/run_pipeline.py --channel geo-daily-ur --topic "Daily update" --dry-run
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
